<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OG Image (1200x630)</title>
<!--
  사이트 공유용 미리보기 이미지 원본 (시안 B · 에디토리얼 미니멀).
  다시 만들기:  node tools/og/render.js   → assets/img/og-image.png
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&amp;family=Space+Grotesk:wght@500;700&amp;display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ffffff; }
  body { position: relative; color: #111111; font-family: 'Noto Sans KR', sans-serif; padding: 64px 80px 56px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 22px; border-bottom: 3px solid #111111; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.02em; }
  .mark { width: 40px; height: 40px; }
  .label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #1f3fd1; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .name { font-weight: 900; font-size: 168px; line-height: 0.95; letter-spacing: -0.045em; }
  .lead { font-size: 32px; font-weight: 500; color: #333333; letter-spacing: -0.01em; }
  .lead b { color: #1f3fd1; font-weight: 700; }
  .bottom { display: flex; justify-content: space-between; align-items: baseline; padding-top: 20px; border-top: 1px solid #dddddd; font-family: 'Space Grotesk', sans-serif; font-size: 22px; color: #5c5c66; }
  .bottom span + span::before { content: "·"; margin: 0 14px; }
  .bar { position: absolute; right: 0; top: 0; width: 24px; height: 100%; background: #1f3fd1; }
</style>
</head>
<body>
  <div class="bar" aria-hidden="true"></div>
  <div class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" fill="#1f3fd1"/><rect x="3" y="3" width="3" height="10" fill="#fff"/><path d="M7 8L11.5 3H14L9.5 8L14 13H11.5Z" fill="#fff"/></svg>
      KOSEONGBOY.DEV
    </div>
    <div class="label">Game Client Engineer</div>
  </div>
  <div class="main">
    <div class="name">고성보이</div>
    <div class="lead"><b>Dev Blog</b> &amp; <b>Portfolio</b> — Unity · C# 게임 클라이언트 개발 기록</div>
  </div>
  <div class="bottom">
    <div><span>Unity</span><span>C#</span><span>C++</span><span>Netcode</span></div>
    <div>koseongboy.github.io</div>
  </div>
</body>
</html>
