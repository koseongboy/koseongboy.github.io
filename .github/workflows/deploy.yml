name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 공개할 파일만 _site 에 모아서 배포합니다 (references 등은 제외).
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html robots.txt sitemap.xml feed.xml google6e14470019bbcacc.html _site/
          cp -r assets portfolio _site/
          # 포트폴리오 원본 데이터(.json)는 공개하지 않음 (완성된 .html 만)
          find _site/portfolio -name '*.json' -delete
          # 블로그 글은 완성된 .html 만 공개 (원본 .md 는 제외)
          if [ -d posts ]; then
            mkdir -p _site/posts
            find posts -maxdepth 1 -name '*.html' -exec cp {} _site/posts/ \;
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
